{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<div class="form-card"><h1>📝 Create Account</h1>
<form method="post">
  <label>Name</label><input name="name" required>
  <label>Email</label><input type="email" name="email" required>
  <label>Mobile Number</label><input name="mobile" pattern="[0-9]{10}" title="10 digit mobile number" required>
  <label>Password</label><input type="password" name="password" minlength="6" required>
  <label>Address</label><textarea name="address" rows="2" required></textarea>
  <button class="btn" type="submit">Register</button>
</form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>
{% endblock %}

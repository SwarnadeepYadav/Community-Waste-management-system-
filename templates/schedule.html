{% extends "base.html" %}{% block title %}Collection Schedule{% endblock %}
{% block content %}
<h1>🚚 Waste Collection Schedule</h1>
<div class="table-wrap"><table>
<tr><th>Area</th><th>Waste Type</th><th>Collection Day</th><th>Time</th><th>Vehicle No.</th></tr>
{% for s in schedules %}<tr><td>{{ s.area }}</td><td>{{ s.waste_type }}</td><td>{{ s.day }}</td><td>{{ s.time }}</td><td>{{ s.vehicle_no }}</td></tr>{% endfor %}
</table></div>
{% endblock %}
